[package]
name = "harness"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "AI agent harness: sessions with hooks, in-memory secrets, confined subprocess tools"

[[bin]]
name = "le-harness"
path = "src/main.rs"

[[bin]]
name = "dummy-tool"
path = "src/bin/dummy-tool.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"
