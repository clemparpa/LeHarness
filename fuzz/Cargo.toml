[package]
name = "harness-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
harness = { path = "../crates/harness" }
serde_json = "1"

[[bin]]
name = "parse_line"
path = "fuzz_targets/parse_line.rs"
test = false
doc = false

[[bin]]
name = "mask_secrets"
path = "fuzz_targets/mask_secrets.rs"
test = false
doc = false
