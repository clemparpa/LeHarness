name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Anti-fork guard: jobs only run for pushes and for PRs opened from within
# this repository, never for PRs coming from forks.
jobs:
  fmt:
    name: fmt
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - run: cargo test --workspace --all-targets

  deny:
    name: deny + audit
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny, cargo-audit
      - run: cargo deny check
      - run: cargo audit

  pinact:
    name: pinact (actions épinglées par SHA, min_age 7 jours)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pinact est un binaire Go (pas un crate Rust) : taiki-e/install-action
      # ne le connait pas et son fallback cargo-binstall echoue. On télécharge
      # la release épinglée et on vérifie le sha256 avant usage.
      - name: Install pinact v5.0.2 (checksum verified)
        env:
          PINACT_VERSION: v5.0.2
        run: |
          set -euo pipefail
          base="https://github.com/suzuki-shunsuke/pinact/releases/download/${PINACT_VERSION}"
          curl -fsSLo pinact_linux_amd64.tar.gz "${base}/pinact_linux_amd64.tar.gz"
          curl -fsSLo checksums.txt "${base}/pinact_5.0.2_checksums.txt"
          grep "pinact_linux_amd64.tar.gz$" checksums.txt | sha256sum -c -
          tar -xzf pinact_linux_amd64.tar.gz pinact
          sudo install -m 0755 pinact /usr/local/bin/pinact
          pinact --version
      # --check: échoue si une action n'est pas épinglée par SHA complet.
      # min_age (7 jours, always: true dans .pinact.yaml) est vérifié aussi.
      - run: pinact run --check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
